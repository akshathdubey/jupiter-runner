name: Jupiter Preview
run-name: Jupiter Preview - ${{ inputs.content_job_id }}

on:
  workflow_dispatch:
    inputs:
      content_job_id:
        description: Jupiter content job ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jupiter-preview-${{ inputs.content_job_id }}
  cancel-in-progress: false

env:
  JUPITER_AICREDITS_OFFLINE_CATALOG: "true"
  JUPITER_ENABLE_TOOL_STRUCTURED_OUTPUT: "false"

jobs:
  preview:
    name: Build 10s watermarked preview
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
      - name: Generate private-core access token
        id: core-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: akshathdubey
          repositories: jupiter-core
          permission-contents: read
          permission-metadata: read
      - name: Checkout canonical Jupiter core
        uses: actions/checkout@v4
        with:
          repository: akshathdubey/jupiter-core
          token: ${{ steps.core-token.outputs.token }}
          ref: main
          path: jupiter-core
          fetch-depth: 1
          clean: true
      - name: Install preview dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libcairo2-dev libpango1.0-dev libpangocairo-1.0-0 libglib2.0-dev ca-certificates curl gnupg
          if ! command -v pdflatex >/dev/null 2>&1; then
            curl -fsSL https://miktex.org/download/key | sudo gpg --dearmor --yes -o /usr/share/keyrings/miktex.gpg
            echo "deb [signed-by=/usr/share/keyrings/miktex.gpg] https://miktex.org/download/ubuntu noble universe" | sudo tee /etc/apt/sources.list.d/miktex.list >/dev/null
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends miktex
          fi
          command -v ffmpeg
          command -v pdflatex
      - name: Prepare Python environment
        shell: bash
        run: |
          set -euo pipefail
          VENV_DIR="${GITHUB_WORKSPACE}/.jupiter_runtime_venv"
          python -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/python" -m pip install --upgrade pip
          "${VENV_DIR}/bin/python" -m pip install -r requirements.txt
          "${VENV_DIR}/bin/python" -m pip install -r jupiter-core/requirements.txt
          "${VENV_DIR}/bin/python" -m pip install -e jupiter-core
          echo "${VENV_DIR}/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${VENV_DIR}" >> "$GITHUB_ENV"
          python -m manim --version
      - name: Preview preflight
        env:
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import py_compile
          for path in ["build.py", "scripts/preview_runner.py"]:
              py_compile.compile(path, doraise=True)
          import app.visual_engine
          from app.intelligence.shorts_generator import build_short_package
          print("PREVIEW PREFLIGHT = OK")
          PY
      - name: Run Jupiter preview
        env:
          CONTENT_JOB_ID: ${{ inputs.content_job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}
          QUALITY: normal
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: python -u build.py --preview
      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupiter-preview-debug-${{ inputs.content_job_id }}
          path: .jupiter_debug/
          if-no-files-found: warn
          retention-days: 3
