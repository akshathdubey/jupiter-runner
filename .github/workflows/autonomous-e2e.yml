name: Jupiter Autonomous E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: jupiter-autonomous-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Clean document → lesson → video
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install E2E control-plane dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run clean end-to-end test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: akshathdubey
          GITHUB_REPO: jupiter-runner
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: python scripts/autonomous_e2e.py

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupiter-autonomous-e2e-${{ github.run_id }}
          path: e2e-report.json
          if-no-files-found: warn
          retention-days: 14
