name: Render Video

# Trigger on pushes to main and manual runs
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel any in-progress runs on the same ref when a new run starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04          # Use Ubuntu 24.04 LTS runner
    timeout-minutes: 30           # Overall job timeout

    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verify system packages and only update if needed
      - name: Verify system dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking preinstalled render dependencies..."
          MISSING=0
          command -v ffmpeg >/dev/null 2>&1 || { echo "MISSING: ffmpeg"; MISSING=1; }
          command -v pkg-config >/dev/null 2>&1 || { echo "MISSING: pkg-config"; MISSING=1; }
          pkg-config --exists cairo 2>/dev/null || { echo "MISSING: cairo"; MISSING=1; }
          pkg-config --exists pangocairo 2>/dev/null || { echo "MISSING: pangocairo"; MISSING=1; }
          pkg-config --exists glib-2.0 2>/dev/null || { echo "MISSING: glib"; MISSING=1; }
          if [ "$MISSING" -eq 0 ]; then
            echo "========================================"
            echo "SYSTEM DEPENDENCIES = ALREADY AVAILABLE"
            echo "========================================"
            ffmpeg -version | head -n 1
            pkg-config --modversion cairo
            pkg-config --modversion pangocairo
            exit 0
          fi
          echo "Some render dependencies are missing; using official Ubuntu mirror..."
          # Replace Azure mirror with archive.ubuntu.com if present
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          fi
          sudo apt-get clean
          # Update with retries/timeouts to avoid long hangs on bad mirrors
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            pkg-config \
            libcairo2 \
            libcairo2-dev \
            libpango-1.0-0 \
            libpango1.0-dev \
            libpangocairo-1.0-0 \
            libglib2.0-0 \
            libglib2.0-dev
          echo "========================================"
          echo "SYSTEM DEPENDENCIES = INSTALLED"
          echo "========================================"
          ffmpeg -version | head -n 1
          pkg-config --modversion cairo
          pkg-config --modversion pangocairo

      # Set up Python 3.x environment
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'   # Use Python 3.12 (installed on runner)
      - name: Check Python version
        run: python --version

      # Cache pip packages (based on requirements.txt)
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install Python dependencies: requirements, Manim, edge-tts
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Pin Manim to v0.19.x, install edge-tts (Python TTS)
          pip install "manim>=0.19,<0.20" edge-tts
          echo "Installed Python packages:"
          manim --version
          python3 -c "import edge_tts; print('edge-tts version', edge_tts.__version__)"
      
      # (Here insert the commands to run the actual rendering, e.g. your render script)
      - name: Run rendering
        run: |
          # Example: adjust to your actual render command
          echo "Starting rendering..."
          python3 render.py    # <-- replace with actual render command
          echo "Rendering finished."

      # Upload the final rendered video on success
      - name: Upload rendered video
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: rendered-video
          path: |
            # adjust path as needed; this uploads any .mp4 in the workspace
            **/*.mp4

      # Always upload logs (or intermediate files) for diagnostics
      - name: Upload logs (on success or failure)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: render-logs
          path: |
            # adjust path to where your workflow logs or output files are saved
            logs/**/*
            *.log
