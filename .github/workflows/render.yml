name: Jupiter Render

run-name: Jupiter Render - ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Jupiter production job ID
        required: true
        type: string

      target_minutes:
        description: Lesson duration in minutes
        required: true
        type: string

      quality:
        description: Jupiter production quality
        required: true
        type: choice
        options:
          - normal
          - premium

      tts_voice:
        description: Edge TTS voice
        required: true
        type: string

      tts_rate:
        description: TTS rate
        required: true
        type: string

      tts_volume:
        description: TTS volume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jupiter-render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render video
    runs-on: ubuntu-24.04

    timeout-minutes: 180

    steps:

      # ==========================================================
      # CHECKOUT PUBLIC RUNNER
      # ==========================================================

      - name: Checkout public runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      # ==========================================================
      # PRIVATE JUPITER CORE ACCESS
      # ==========================================================

      - name: Generate private-core access token
        id: core-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: akshathdubey
          repositories: |
            jupiter-core
          permission-contents: read
          permission-metadata: read

      - name: Checkout private Jupiter core
        uses: actions/checkout@v4
        with:
          repository: akshathdubey/jupiter-core
          token: ${{ steps.core-token.outputs.token }}
          path: jupiter-core
          fetch-depth: 1
          clean: true

      # ==========================================================
      # WORKSPACE / INPUT DIAGNOSTICS
      # ==========================================================

      - name: Verify Jupiter repository layout
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "JUPITER RENDER WORKSPACE"
          echo "========================================"

          echo "JOB_ID         = ${{ inputs.job_id }}"
          echo "TARGET_MINUTES = ${{ inputs.target_minutes }}"
          echo "QUALITY        = ${{ inputs.quality }}"
          echo ""

          test -f "./runner.py"
          test -d "./jupiter-core"

          test -f "./jupiter-core/app/__init__.py"
          test -f "./jupiter-core/app/config.py"

          echo "Repository layout = OK"

      # ==========================================================
      # SYSTEM DEPENDENCIES
      #
      # Do NOT blindly run apt-get update on every render.
      # Only install packages when the hosted runner actually
      # lacks something required by Manim.
      # ==========================================================

      - name: Verify system dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHECKING SYSTEM DEPENDENCIES"
          echo "========================================"

          MISSING=0

          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "MISSING: ffmpeg"
            MISSING=1
          fi

          if ! command -v pkg-config >/dev/null 2>&1; then
            echo "MISSING: pkg-config"
            MISSING=1
          fi

          if ! pkg-config --exists cairo 2>/dev/null; then
            echo "MISSING: cairo"
            MISSING=1
          fi

          if ! pkg-config --exists pangocairo 2>/dev/null; then
            echo "MISSING: pangocairo"
            MISSING=1
          fi

          if ! pkg-config --exists glib-2.0 2>/dev/null; then
            echo "MISSING: glib-2.0"
            MISSING=1
          fi

          if [ "$MISSING" -eq 0 ]; then
            echo ""
            echo "SYSTEM DEPENDENCIES = READY"

            ffmpeg -version | head -n 1

            echo "cairo      = $(pkg-config --modversion cairo)"
            echo "pangocairo = $(pkg-config --modversion pangocairo)"
            echo "glib       = $(pkg-config --modversion glib-2.0)"

            exit 0
          fi

          echo ""
          echo "Some system dependencies are missing."
          echo "Installing only the missing rendering stack..."

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/ubuntu.sources

            sudo sed -i \
              's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi

          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list

            sudo sed -i \
              's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
          fi

          sudo apt-get clean

          sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update

          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            pkg-config \
            libcairo2 \
            libcairo2-dev \
            libpango-1.0-0 \
            libpango1.0-dev \
            libpangocairo-1.0-0 \
            libglib2.0-0 \
            libglib2.0-dev

          echo ""
          echo "SYSTEM DEPENDENCIES = INSTALLED"

          ffmpeg -version | head -n 1

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            jupiter-core/requirements.txt

      - name: Verify Python
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -c "import sys; print(sys.executable)"

      # ==========================================================
      # PYTHON DEPENDENCIES
      # ==========================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f jupiter-core/requirements.txt ]; then
            python -m pip install -r jupiter-core/requirements.txt
          fi

          python -m pip install \
            "manim>=0.19,<0.20" \
            edge-tts

          echo ""
          echo "========================================"
          echo "PRODUCTION DEPENDENCIES"
          echo "========================================"

          python -m manim --version

          python - <<'PY'
          import edge_tts
          print("EDGE TTS = OK")
          PY

          python - <<'PY'
          import requests
          print("REQUESTS = OK")
          PY

      # ==========================================================
      # PRODUCTION ENVIRONMENT
      # ==========================================================

      - name: Verify production environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING PRODUCTION ENVIRONMENT"
          echo "========================================"

          test -n "${SUPABASE_URL:-}" || {
            echo "ERROR: SUPABASE_URL is not configured."
            exit 1
          }

          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is not configured."
            exit 1
          }

          test -n "${AICREDITS_API_KEY:-}" || {
            echo "ERROR: AICREDITS_API_KEY is not configured."
            exit 1
          }

          echo "SUPABASE_URL              = OK"
          echo "SUPABASE_SERVICE_ROLE_KEY = OK"
          echo "AICREDITS_API_KEY         = OK"

      # ==========================================================
      # IMPORT CHECK
      # ==========================================================

      - name: Verify Jupiter production imports
        shell: bash
        env:
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          set -euo pipefail

          export PYTHONPATH="${GITHUB_WORKSPACE}/jupiter-core"

          python - <<'PY'
          import app

          from app.config import settings
          from app.intelligence.production_pipeline import generate_final_video

          assert settings.aicredits_api_key

          print("JUPITER CORE = OK")
          print("PRODUCTION PIPELINE = OK")
          PY

      # ==========================================================
      # RENDER
      #
      # runner.py is the ONLY production entry point.
      # ==========================================================

      - name: Run Jupiter render
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          QUALITY: ${{ inputs.quality }}

          TTS_VOICE: ${{ inputs.tts_voice }}
          TTS_RATE: ${{ inputs.tts_rate }}
          TTS_VOLUME: ${{ inputs.tts_volume }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}

          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/jupiter-core

        run: |
          set -euo pipefail

          echo "========================================"
          echo "       JUPITER PRODUCTION JOB"
          echo "========================================"

          echo "JOB_ID         = ${JOB_ID}"
          echo "TARGET_MINUTES = ${TARGET_MINUTES}"
          echo "QUALITY        = ${QUALITY}"
          echo "TTS_VOICE      = ${TTS_VOICE}"
          echo "TTS_RATE       = ${TTS_RATE}"
          echo "TTS_VOLUME     = ${TTS_VOLUME}"
          echo ""

          python -u runner.py

      # ==========================================================
      # DEBUG ARTIFACTS
      # ==========================================================

      - name: Upload Jupiter debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupiter-debug-${{ inputs.job_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .jupiter_debug/${{ inputs.job_id }}/**
            .jupiter_jobs/${{ inputs.job_id }}/**

      # ==========================================================
      # FINAL VIDEO BACKUP ARTIFACT
      # ==========================================================

      - name: Upload rendered video artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jupiter-render-${{ inputs.job_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            .jupiter_debug/${{ inputs.job_id }}/**/*.mp4
            .jupiter_jobs/${{ inputs.job_id }}/**/*.mp4

      # ==========================================================
      # FAILURE SUMMARY
      # ==========================================================

      - name: Render failure summary
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "       JUPITER RENDER FAILED"
          echo "========================================"

          echo "JOB_ID         = ${{ inputs.job_id }}"
          echo "TARGET_MINUTES = ${{ inputs.target_minutes }}"
          echo "QUALITY        = ${{ inputs.quality }}"

          echo ""
          echo "Workspace:"
          pwd

          echo ""
          echo "Debug directories:"

          find . \
            -maxdepth 4 \
            -type d \
            \( \
              -name ".jupiter_debug" \
              -o \
              -name ".jupiter_jobs" \
            \) \
            -print 2>/dev/null || true

          echo ""
          echo "MP4 files:"

          find . \
            -type f \
            -name "*.mp4" \
            -print 2>/dev/null || true