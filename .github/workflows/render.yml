name: Jupiter Render

run-name: Jupiter Render - ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Jupiter production job ID
        required: true
        type: string
      target_minutes:
        description: Lesson duration in minutes (used only as manual fallback)
        required: true
        type: string
      quality:
        description: Jupiter production quality (used only as manual fallback)
        required: true
        type: choice
        options:
          - normal
          - premium
      tts_voice:
        description: Edge TTS voice (database value is authoritative)
        required: false
        default: en-US-AriaNeural
        type: string
      tts_rate:
        description: TTS rate (database value is authoritative)
        required: false
        default: +0%
        type: string
      tts_volume:
        description: TTS volume (database value is authoritative)
        required: false
        default: +0%
        type: string

permissions:
  contents: read

concurrency:
  group: jupiter-render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render video
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JUPITER_AICREDITS_OFFLINE_CATALOG: "true"

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Generate private-core access token
        id: core-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: akshathdubey
          repositories: |
            jupiter-core
          permission-contents: read
          permission-metadata: read

      - name: Checkout private Jupiter core
        uses: actions/checkout@v4
        with:
          repository: akshathdubey/jupiter-core
          token: ${{ steps.core-token.outputs.token }}
          ref: main
          path: jupiter-core
          fetch-depth: 1
          clean: true

      - name: Verify checked out core revision
        shell: bash
        run: |
          set -euo pipefail
          cd jupiter-core
          echo "JUPITER CORE COMMIT: $(git rev-parse HEAD)"
          echo "JUPITER CORE SUBJECT: $(git log -1 --pretty=%s)"
          grep -q '^import os$' app/intelligence/llm_gateway.py
          test -f app/visual_engine/camera.py
          test -f app/visual_engine/math_engine.py
          test -f app/visual_engine/constraints.py
          test -f app/visual_engine/story_patterns.py
          test -f app/visual_engine/audio_sync.py
          test -f app/visual_engine/visual_qa.py
          test -f app/intelligence/caption_burn_in.py
          echo "CORE REVISION = OK"

      - name: Verify Jupiter repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f ./runner.py
          test -d ./jupiter-core
          test -f ./jupiter-core/app/__init__.py
          test -f ./jupiter-core/app/config.py
          test -f ./jupiter-core/app/intelligence/production_pipeline.py
          test -f ./jupiter-core/app/intelligence/caption_burn_in.py
          echo "Repository layout = OK"

      - name: Setup Jupiter runtime
        uses: ./.github/actions/jupiter-runtime
        with:
          install-miktex: "true"
          install-edge-tts: "true"

      - name: Verify mathematical rendering without spending AI credits
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from app.visual_engine.math_engine import preflight_math, compile_latex
          status = preflight_math()
          assert status["available"], status
          output = Path(".jupiter_cache/math-preflight")
          pdf = compile_latex(r"E=mc^2", output)
          assert pdf.exists() and pdf.stat().st_size > 0
          print("MATH PREFLIGHT = OK")
          print(f"MATH PDF = {pdf}")
          PY

      - name: Verify production environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${AICREDITS_API_KEY:-}"
          echo "PRODUCTION ENVIRONMENT = OK"

      - name: Resolve production job contract
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FALLBACK_TARGET_MINUTES: ${{ inputs.target_minutes }}
          FALLBACK_QUALITY: ${{ inputs.quality }}
          FALLBACK_TTS_VOICE: ${{ inputs.tts_voice }}
          FALLBACK_TTS_RATE: ${{ inputs.tts_rate }}
          FALLBACK_TTS_VOLUME: ${{ inputs.tts_volume }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from supabase import create_client
          supabase = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_ROLE_KEY"])
          job_id = os.environ["JOB_ID"]
          result = supabase.table("jobs").select("id,kind,status,payment_status,target_minutes,quality,tts_voice,tts_rate,tts_volume").eq("id", job_id).single().execute()
          job = result.data
          if not job: raise RuntimeError(f"Production job {job_id} was not found.")
          if job.get("kind") != "video": raise RuntimeError(f"Job {job_id} is not a video generation job.")
          if job.get("payment_status") not in {"paid", "test"}: raise RuntimeError(f"Job {job_id} is not paid. payment_status={job.get('payment_status')!r}")
          target = int(job.get("target_minutes") or os.environ["FALLBACK_TARGET_MINUTES"])
          quality = str(job.get("quality") or os.environ["FALLBACK_QUALITY"]).strip().lower()
          if quality == "premium": quality = "elite"
          if quality not in {"normal", "elite"}: raise RuntimeError(f"Unsupported database quality: {quality!r}")
          values = {"TARGET_MINUTES": str(target), "QUALITY": quality, "TTS_VOICE": str(job.get("tts_voice") or os.environ["FALLBACK_TTS_VOICE"]).strip(), "TTS_RATE": str(job.get("tts_rate") or os.environ["FALLBACK_TTS_RATE"]).strip(), "TTS_VOLUME": str(job.get("tts_volume") or os.environ["FALLBACK_TTS_VOLUME"]).strip(), "JUPITER_WORKFLOW_RUN_ID": os.environ.get("GITHUB_RUN_ID", "")}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items(): handle.write(f"{key}={value}\n")
          if os.environ.get("GITHUB_RUN_ID"):
              update = supabase.table("jobs").update({"workflow_run_id": int(os.environ["GITHUB_RUN_ID"])}).eq("id", job_id).execute()
              if getattr(update, "error", None): raise RuntimeError(str(update.error))
          print("PRODUCTION JOB CONTRACT = OK")
          PY

      - name: Verify Jupiter production imports and catalog without spending credits
        env:
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}
          JUPITER_AICREDITS_OFFLINE_CATALOG: "true"
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import app
          import app.visual_engine
          from app.intelligence.caption_burn_in import build_caption_cues
          from app.intelligence.production_pipeline import generate_final_video
          from app.intelligence.dynamic_token_budget import ModelCatalog
          assert build_caption_cues({"units": [{"duration_seconds": 3, "narration": "Test caption rendering."}]})
          models = ModelCatalog(os.environ["AICREDITS_API_KEY"], "https://api.aicredits.in/v1").refresh()
          assert models
          print("JUPITER CORE = OK")
          print("CAPTION ENGINE = OK")
          print("PRODUCTION PIPELINE = OK")
          print("OFFLINE CATALOG = OK")
          PY

      - name: Run Jupiter render
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}
          JUPITER_AICREDITS_OFFLINE_CATALOG: "true"
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
        run: python -u runner.py

      - name: Upload Jupiter debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupiter-debug-${{ inputs.job_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .jupiter_debug/${{ inputs.job_id }}/**
