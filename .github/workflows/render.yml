name: Jupiter Render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Jupiter job ID
        required: true
        type: string

      quality:
        description: Render quality
        required: true
        type: choice
        options:
          - normal
          - premium

      target_minutes:
        description: Target video duration in minutes
        required: true
        type: string

      tts_voice:
        description: TTS voice
        required: false
        default: en-US-AriaNeural
        type: string

      tts_rate:
        description: TTS speaking rate
        required: false
        default: "+0%"
        type: string

      tts_volume:
        description: TTS volume
        required: false
        default: "+0%"
        type: string

permissions:
  contents: read

concurrency:
  group: jupiter-render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Runner diagnostics
        run: |
          echo "========================================"
          echo "        JUPITER CLOUD RENDER"
          echo "========================================"
          echo "JOB_ID         = ${{ inputs.job_id }}"
          echo "TARGET_MINUTES = ${{ inputs.target_minutes }}"
          echo "QUALITY        = ${{ inputs.quality }}"
          echo "TTS_VOICE      = ${{ inputs.tts_voice }}"
          echo "TTS_RATE       = ${{ inputs.tts_rate }}"
          echo "TTS_VOLUME     = ${{ inputs.tts_volume }}"
          echo "========================================"

          uname -a
          python --version

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            pkg-config \
            libcairo2 \
            libcairo2-dev \
            libpango-1.0-0 \
            libpango1.0-dev \
            libpangocairo-1.0-0 \
            libglib2.0-0 \
            libglib2.0-dev \
            ffmpeg

      - name: Verify Pango/Cairo
        run: |
          pkg-config --modversion pangocairo
          pkg-config --modversion cairo
          echo "PANGOCAIRO = OK"
          echo "CAIRO = OK"

      - name: Generate private-core access token
        id: core-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: akshathdubey
          repositories: |
            jupiter-core
          permission-contents: read
          permission-metadata: read

      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private Jupiter core
        uses: actions/checkout@v4
        with:
          repository: akshathdubey/jupiter-core
          token: ${{ steps.core-token.outputs.token }}
          path: jupiter-core
          clean: false

      - name: Verify private core
        run: |
          set -e

          test -f jupiter-core/app/__init__.py
          test -f jupiter-core/app/intelligence/production_pipeline.py
          test -f jupiter-core/app/intelligence/duration_controlled_narrator.py
          test -f jupiter-core/app/intelligence/dynamic_token_budget.py

          echo "PRIVATE JUPITER CORE = OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Jupiter core dependencies
        working-directory: jupiter-core
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install requests
          pip install "manim>=0.19,<0.20"
          pip install edge-tts

          pip install -e .

      - name: Verify production dependencies
        env:
          PYTHONPATH: ${{ github.workspace }}/jupiter-core

          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}

        run: |
          set -e

          python -c "import requests; print('REQUESTS = OK')"
          python -c "import manim; print('MANIM = OK')"
          python -c "import edge_tts; print('EDGE TTS = OK')"

          python -c "from app.intelligence.production_pipeline import generate_final_video; print('PRODUCTION PIPELINE = OK')"

      - name: Run Jupiter render
        env:
          JOB_ID: ${{ inputs.job_id }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          QUALITY: ${{ inputs.quality }}

          TTS_VOICE: ${{ inputs.tts_voice }}
          TTS_RATE: ${{ inputs.tts_rate }}
          TTS_VOLUME: ${{ inputs.tts_volume }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}

        run: |
          python runner.py