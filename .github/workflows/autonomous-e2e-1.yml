name: "Jupiter Autonomous E2E #1"
run-name: "Jupiter Autonomous E2E #1"

on:
  push:
    paths:
      - ".github/workflows/autonomous-e2e-1.yml"
      - ".github/workflows/analyze.yml"
      - ".github/workflows/render.yml"
      - ".github/workflows/shorts.yml"
      - ".github/workflows/publish.yml"
      - ".github/actions/jupiter-runtime/action.yml"
      - "scripts/autonomous_e2e_1.py"
      - "scripts/audit_jupiter_imports.py"
      - "scripts/shorts_runner.py"
      - "scripts/publisher.py"
      - "runner.py"
      - "analyze_runner.py"
  workflow_dispatch:
    inputs:
      base_url:
        description: Jupiter deployment to exercise
        required: false
        default: https://jupiter.zenithxlabs.com
        type: string
      target_minutes:
        description: Test lesson duration
        required: false
        default: "3"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: jupiter-autonomous-e2e-1
  cancel-in-progress: false

env:
  JUPITER_E2E_BASE_URL: ${{ inputs.base_url || 'https://jupiter.zenithxlabs.com' }}
  JUPITER_E2E_MINUTES: ${{ inputs.target_minutes || '3' }}
  GITHUB_OWNER: akshathdubey
  GITHUB_REPO: jupiter-runner
  GITHUB_RENDER_WORKFLOW: render.yml
  GITHUB_SHORTS_WORKFLOW: shorts.yml
  GITHUB_PUBLISH_WORKFLOW: publish.yml
  JUPITER_AICREDITS_OFFLINE_CATALOG: "true"

jobs:
  e2e:
    name: Clean source → Short → video → publication contract
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Install E2E control-plane dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get clean
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "supabase>=2.18,<3" reportlab requests cryptography

      - name: Static source audit before E2E
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile analyze_runner.py runner.py scripts/autonomous_e2e_1.py scripts/audit_jupiter_imports.py scripts/shorts_runner.py scripts/publisher.py
          python scripts/audit_jupiter_imports.py

      - name: Run autonomous clean E2E #1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: python -u scripts/autonomous_e2e_1.py

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupiter-autonomous-e2e-1-${{ github.run_id }}
          path: e2e-report.json
          if-no-files-found: warn
          retention-days: 14
