name: Jupiter Shorts
run-name: Jupiter Shorts - ${{ inputs.content_job_id }}

on:
  workflow_dispatch:
    inputs:
      content_job_id:
        description: Jupiter content job ID
        required: true
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: jupiter-shorts-${{ inputs.content_job_id }}
  cancel-in-progress: false
env:
  JUPITER_AICREDITS_OFFLINE_CATALOG: "true"
  JUPITER_ENABLE_TOOL_STRUCTURED_OUTPUT: "false"

jobs:
  shorts:
    name: Build and publish Short
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with: { fetch-depth: 1, clean: true }
      - name: Generate private-core access token
        id: core-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: akshathdubey
          repositories: jupiter-core
          permission-contents: read
          permission-metadata: read
      - name: Checkout canonical Jupiter core
        uses: actions/checkout@v4
        with:
          repository: akshathdubey/jupiter-core
          token: ${{ steps.core-token.outputs.token }}
          ref: main
          path: jupiter-core
          fetch-depth: 1
          clean: true
      - name: Setup Jupiter runtime
        uses: ./.github/actions/jupiter-runtime
        with:
          install-miktex: "true"
      - name: Zero-credit Shorts preflight
        env:
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import py_compile
          files = [
              "scripts/shorts_runner.py",
              "scripts/publisher.py",
              "jupiter-core/app/intelligence/shorts_generator.py",
              "jupiter-core/app/intelligence/visual_designer.py",
              "jupiter-core/app/intelligence/production_pipeline.py",
              "jupiter-core/app/intelligence/caption_burn_in.py",
          ]
          for path in files: py_compile.compile(path, doraise=True)
          import app.visual_engine
          from app.intelligence.shorts_generator import build_short_package
          print("SHORTS PREFLIGHT = OK")
          PY
      - name: Run Jupiter Shorts
        env:
          CONTENT_JOB_ID: ${{ inputs.content_job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY: normal
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: python -u scripts/shorts_runner.py
      - name: Upload Shorts diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupiter-shorts-debug-${{ inputs.content_job_id }}
          path: .jupiter_debug/
          if-no-files-found: warn
          retention-days: 7
