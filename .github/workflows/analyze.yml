name: Jupiter Analyze

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Jupiter analysis job ID
        required: true
        type: string

      target_minutes:
        description: Lesson duration
        required: true
        type: string

      quality:
        description: Internal Jupiter quality
        required: true
        type: choice
        options:
          - normal
          - elite

permissions:
  contents: read

concurrency:
  group: jupiter-analysis-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze document
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Runner diagnostics
        run: |
          echo "========================================"
          echo "JUPITER ANALYSIS WORKFLOW STARTED"
          echo "========================================"

          echo "JOB_ID=${{ inputs.job_id }}"
          echo "TARGET_MINUTES=${{ inputs.target_minutes }}"
          echo "QUALITY=${{ inputs.quality }}"

          echo ""
          echo "RUNNER:"
          uname -a

          echo ""
          echo "PYTHON:"
          python --version

          echo ""
          echo "WORKSPACE:"
          pwd
          ls -la

      - name: Mark job as github_started
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          raw_url = os.environ["SUPABASE_URL"].strip()

          # Accept either:
          # https://project.supabase.co
          # or
          # https://project.supabase.co/rest/v1
          base_url = raw_url.rstrip("/")

          if base_url.lower().endswith("/rest/v1"):
              base_url = base_url[:-7].rstrip("/")

          print(
              "SUPABASE HOST:",
              urllib.parse.urlparse(base_url).netloc,
          )

          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          job_id = os.environ["JOB_ID"]

          endpoint = (
              f"{base_url}/rest/v1/jobs"
              f"?id=eq.{urllib.parse.quote(job_id, safe='')}"
          )

          payload = json.dumps({
              "status": "running",
              "stage": "github_started",
              "progress": 10,
              "error": None,
          }).encode("utf-8")

          request = urllib.request.Request(
              endpoint,
              method="PATCH",
              data=payload,
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "Prefer": "return=minimal",
              },
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:
                  print(
                      "SUPABASE UPDATE STATUS:",
                      response.status,
                  )

          except urllib.error.HTTPError as error:
              body = error.read().decode(
                  "utf-8",
                  errors="replace",
              )

              print(
                  "SUPABASE HTTP ERROR:",
                  error.code,
              )

              print(
                  "SUPABASE RESPONSE:",
                  body,
              )

              print(
                  "REQUEST ENDPOINT:",
                  endpoint,
              )

              raise
          PY

      - name: Generate private-core access token
        id: core-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: akshathdubey
          repositories: |
            jupiter-core
          permission-contents: read
          permission-metadata: read

      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private Jupiter core
        uses: actions/checkout@v4
        with:
          repository: akshathdubey/jupiter-core
          token: ${{ steps.core-token.outputs.token }}
          path: jupiter-core
          clean: false

      - name: Mark private core ready
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          base_url = (
              os.environ["SUPABASE_URL"]
              .strip()
              .rstrip("/")
          )

          if base_url.lower().endswith(
              "/rest/v1"
          ):
              base_url = base_url[:-7].rstrip("/")

          key = os.environ[
              "SUPABASE_SERVICE_ROLE_KEY"
          ]

          job_id = os.environ[
              "JOB_ID"
          ]

          endpoint = (
              f"{base_url}/rest/v1/jobs"
              f"?id=eq.{job_id}"
          )

          payload = json.dumps({
              "stage":
                  "private_core_ready",
              "progress":
                  20,
          }).encode("utf-8")

          request = urllib.request.Request(
              endpoint,
              method="PATCH",
              data=payload,
              headers={
                  "apikey": key,
                  "Authorization":
                      f"Bearer {key}",
                  "Content-Type":
                      "application/json",
                  "Prefer":
                      "return=minimal",
              },
          )

          with urllib.request.urlopen(
              request,
              timeout=30,
          ) as response:
              print(
                  "SUPABASE UPDATE STATUS:",
                  response.status,
              )
          PY

      - name: Verify private core
        run: |
          set -e

          test -f jupiter-core/app/__init__.py
          test -f jupiter-core/app/parsers/pdf.py
          test -f jupiter-core/app/intelligence/classifier.py
          test -f jupiter-core/app/intelligence/teacher.py
          test -f jupiter-core/app/intelligence/visual_designer.py
          test -f jupiter-core/app/intelligence/visual_validator.py

          echo "PRIVATE JUPITER CORE = OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Jupiter core
        working-directory: jupiter-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify analysis imports
        env:
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
        run: |
          python -c "from app.parsers.pdf import parse_pdf; print('PDF PARSER = OK')"
          python -c "from app.intelligence.classifier import classify_artifact1; print('CLASSIFIER = OK')"
          python -c "from app.intelligence.estimator import estimate_credits; print('ESTIMATOR = OK')"
          python -c "from app.intelligence.teacher import create_teaching_plan; print('TEACHER = OK')"
          python -c "from app.intelligence.teacher_reviewer import review_teaching_plan; print('TEACHER REVIEWER = OK')"
          python -c "from app.intelligence.visual_designer import create_visual_design; print('VISUAL DESIGNER = OK')"
          python -c "from app.intelligence.visual_reviewer import review_visual_design; print('VISUAL REVIEWER = OK')"
          python -c "from app.intelligence.fact_ledger import build_fact_ledger; print('FACT LEDGER = OK')"
          python -c "from app.intelligence.visual_validator import validate_visual_design; print('VISUAL VALIDATOR = OK')"

      - name: Run Jupiter analysis
        env:
          JOB_ID: ${{ inputs.job_id }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          QUALITY: ${{ inputs.quality }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}

        run: |
          python analyze_runner.py