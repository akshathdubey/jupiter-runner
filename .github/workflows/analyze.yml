name: Jupiter Analyze

run-name: Jupiter Analyze - ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Jupiter analysis job ID
        required: true
        type: string
      target_minutes:
        description: Lesson duration
        required: true
        type: string
      quality:
        description: Internal Jupiter quality
        required: true
        type: choice
        options:
          - normal
          - elite

permissions:
  contents: read

concurrency:
  group: jupiter-analysis-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze document
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      JUPITER_AICREDITS_OFFLINE_CATALOG: "true"
      JUPITER_ENABLE_TOOL_STRUCTURED_OUTPUT: "false"

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Generate private-core access token
        id: core-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: akshathdubey
          repositories: |
            jupiter-core
          permission-contents: read
          permission-metadata: read

      - name: Checkout canonical Jupiter core
        uses: actions/checkout@v4
        with:
          repository: akshathdubey/jupiter-core
          token: ${{ steps.core-token.outputs.token }}
          ref: main
          path: jupiter-core
          fetch-depth: 1
          clean: true

      - name: Verify canonical core before AI work
        shell: bash
        run: |
          set -euo pipefail
          cd jupiter-core
          echo "JUPITER CORE COMMIT=$(git rev-parse HEAD)"
          test -f app/intelligence/llm_gateway.py
          test -f app/intelligence/production_pipeline.py
          test -f app/intelligence/caption_burn_in.py
          test -f app/visual_engine/camera.py
          test -f app/visual_engine/math_engine.py
          test -f app/visual_engine/constraints.py
          test -f app/visual_engine/story_patterns.py
          test -f app/visual_engine/audio_sync.py
          test -f app/visual_engine/visual_qa.py
          echo "CORE PREFLIGHT = OK"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            jupiter-core/requirements.txt
            jupiter-core/pyproject.toml

      - name: Verify rendering system dependencies
        shell: bash
        run: |
          set -euo pipefail
          MISSING=0
          command -v ffmpeg >/dev/null 2>&1 || MISSING=1
          command -v pkg-config >/dev/null 2>&1 || MISSING=1
          pkg-config --exists cairo 2>/dev/null || MISSING=1
          pkg-config --exists pangocairo 2>/dev/null || MISSING=1
          pkg-config --exists glib-2.0 2>/dev/null || MISSING=1
          if [ "$MISSING" -eq 0 ]; then
            echo "SYSTEM DEPENDENCIES = READY"
          else
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get clean
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends ffmpeg pkg-config libcairo2 libcairo2-dev libpango-1.0-0 libpango1.0-dev libpangocairo-1.0-0 libglib2.0-0 libglib2.0-dev
          fi
          ffmpeg -version | head -n 1
          pkg-config --modversion cairo
          pkg-config --modversion pangocairo
          pkg-config --modversion glib-2.0

      - name: Install MiKTeX for analysis-time math preflight
        shell: bash
        run: |
          set -euo pipefail
          if command -v pdflatex >/dev/null 2>&1 && command -v miktex >/dev/null 2>&1; then
            echo "MiKTeX already available."
          else
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends ca-certificates curl gnupg
            curl -fsSL https://miktex.org/download/key | sudo gpg --dearmor --yes -o /usr/share/keyrings/miktex.gpg
            echo "deb [signed-by=/usr/share/keyrings/miktex.gpg] https://miktex.org/download/ubuntu noble universe" | sudo tee /etc/apt/sources.list.d/miktex.list >/dev/null
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends miktex
          fi
          command -v pdflatex
          pdflatex --version | head -n 1
          if command -v miktex >/dev/null 2>&1; then miktex --version | head -n 1; fi
          if command -v initexmf >/dev/null 2>&1; then sudo initexmf --admin --set-config-value '[MPM]AutoInstall=1' || true; fi
          echo "MIKTEX = READY"

      - name: Restore Jupiter Python environment cache
        uses: actions/cache@v4
        with:
          path: |
            .jupiter_runtime_venv
            .jupiter_cache
          key: jupiter-${{ runner.os }}-py311-analysis-${{ hashFiles('requirements.txt', 'jupiter-core/requirements.txt', 'jupiter-core/pyproject.toml') }}-v4

      - name: Prepare cached Jupiter runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uploads jobs .jupiter_cache
          VENV_DIR="${GITHUB_WORKSPACE}/.jupiter_runtime_venv"
          if [ ! -x "${VENV_DIR}/bin/python" ]; then
            rm -rf "${VENV_DIR}"
            python -m venv "${VENV_DIR}"
            "${VENV_DIR}/bin/python" -m pip install --upgrade pip
            "${VENV_DIR}/bin/python" -m pip install -r requirements.txt
            "${VENV_DIR}/bin/python" -m pip install -r jupiter-core/requirements.txt
            "${VENV_DIR}/bin/python" -m pip install -e jupiter-core
          else
            echo "Using cached Jupiter Python environment."
          fi
          echo "${VENV_DIR}/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${VENV_DIR}" >> "$GITHUB_ENV"
          python -m manim --version

      - name: Zero-credit rendering contract preflight
        env:
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import py_compile
          from pathlib import Path

          files = [
              "analyze_runner.py",
              "jupiter-core/app/intelligence/llm_gateway.py",
              "jupiter-core/app/intelligence/dynamic_token_budget.py",
              "jupiter-core/app/intelligence/classifier.py",
              "jupiter-core/app/intelligence/teacher.py",
              "jupiter-core/app/intelligence/teacher_reviewer.py",
              "jupiter-core/app/intelligence/visual_designer.py",
              "jupiter-core/app/intelligence/visual_validator.py",
              "jupiter-core/app/intelligence/visual_reviewer.py",
              "jupiter-core/app/intelligence/fact_ledger.py",
              "jupiter-core/app/intelligence/image_asset_manager.py",
              "jupiter-core/app/intelligence/production_pipeline.py",
              "jupiter-core/app/intelligence/caption_burn_in.py",
          ]
          for path in files:
              py_compile.compile(path, doraise=True)

          import app.visual_engine
          from app.intelligence.caption_burn_in import build_caption_cues
          from app.intelligence.dynamic_token_budget import ModelCatalog
          from app.intelligence.llm_gateway import LLMGateway
          from app.visual_engine.math_engine import compile_latex, preflight_math

          status = preflight_math()
          assert status["available"], status
          pdf = compile_latex(r"E=mc^2", Path(".jupiter_cache") / "analysis-math-preflight")
          assert pdf.exists() and pdf.stat().st_size > 0

          sample_teacher = {
              "units": [
                  {"duration_seconds": 4, "narration": "A caption preflight confirms the final lower safe area contract."}
              ]
          }
          cues = build_caption_cues(sample_teacher)
          assert cues and cues[0]["end"] > cues[0]["start"]

          models = ModelCatalog(os.environ["AICREDITS_API_KEY"], "https://api.aicredits.in/v1").refresh()
          assert models
          print("ZERO-CREDIT RENDERING CONTRACT = OK")
          print("MODELS =", ", ".join(model.id for model in models))
          print("MATH PREFLIGHT = OK")
          print("CAPTION PREFLIGHT = OK")
          PY

      - name: Verify Supabase analysis job contract
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from supabase import create_client

          client = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_ROLE_KEY"])
          job = client.table("jobs").select("id,kind,status,target_minutes,quality,document_path,workflow_run_id").eq("id", os.environ["JOB_ID"]).single().execute().data
          if not job:
              raise RuntimeError("Analysis job was not found.")
          if job.get("kind") != "analysis":
              raise RuntimeError(f"Expected analysis job, got {job.get('kind')!r}.")
          if not job.get("document_path"):
              raise RuntimeError("Analysis job has no document_path.")
          target = int(job.get("target_minutes") or os.environ["TARGET_MINUTES_FALLBACK"] if "TARGET_MINUTES_FALLBACK" in os.environ else ${{ inputs.target_minutes }})
          if target not in {1, 3, 5, 10, 15, 30, 60}:
              raise RuntimeError(f"Unsupported target_minutes={target}")
          run_id = os.environ.get("GITHUB_RUN_ID")
          if run_id:
              client.table("jobs").update({"workflow_run_id": int(run_id)}).eq("id", os.environ["JOB_ID"]).execute()
          print("SUPABASE ANALYSIS CONTRACT = OK")
          print("WORKFLOW_RUN_ID =", run_id)
          PY

      - name: Static audit
        shell: bash
        run: python scripts/audit_jupiter_imports.py

      - name: Run Jupiter analysis
        env:
          JOB_ID: ${{ inputs.job_id }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          QUALITY: ${{ inputs.quality }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_MODEL_NORMAL: ${{ vars.AICREDITS_MODEL_NORMAL }}
          AICREDITS_MODEL_ELITE: ${{ vars.AICREDITS_MODEL_ELITE }}
          JUPITER_AICREDITS_OFFLINE_CATALOG: "true"
          JUPITER_ENABLE_TOOL_STRUCTURED_OUTPUT: "false"
          PYTHONPATH: ${{ github.workspace }}/jupiter-core
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: python -u analyze_runner.py

      - name: Upload analysis diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupiter-analysis-debug-${{ inputs.job_id }}
          path: |
            jobs/${{ inputs.job_id }}/
            uploads/
            .jupiter_cache/
          if-no-files-found: warn
          retention-days: 7
